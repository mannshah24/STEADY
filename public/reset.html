<!DOCTYPE html>
<html>
<head><title>Reset STEADY</title></head>
<body style="background: black; color: white; font-family: sans-serif; padding: 50px; text-align: center;">
  <h1>Reset STEADY</h1>
  <button onclick="localStorage.clear(); alert('Cleared! Now refresh your STEADY app.'); " style="padding: 20px 40px; font-size: 18px; background: linear-gradient(to right, cyan, purple); border: none; color: white; border-radius: 10px; cursor: pointer;">
    Clear Storage
  </button>
  <p style="margin-top: 30px; color: gray;">This will clear your activation state and let you see the onboarding flow again.</p>
</body>
</html>
