[package]
name = "steady"
version = "0.1.0"
description = "STEADY - Solana autopilot investing with downside protection"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "steady"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"

